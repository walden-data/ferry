[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dagster-ferry"
version = "0.1.0"
description = "Dagster integration for Ferry, a Rust-native reverse ETL engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["dagster", "ferry", "reverse-etl", "etl", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dagster>=1.8",
    "ferry-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://github.com/walden-data/ferry"
Repository = "https://github.com/walden-data/ferry"
Documentation = "https://github.com/walden-data/ferry/tree/main/integrations/dagster-ferry#readme"
Issues = "https://github.com/walden-data/ferry/issues"
Changelog = "https://github.com/walden-data/ferry/releases"

# Local development only: link ferry-core to the in-tree PyO3 source so `uv
# sync` resolves the native dependency without a published wheel. The
# `[tool.uv.sources]` table is never propagated into built wheel METADATA, so
# the published requirement stays `ferry-core>=0.1.0`.
[tool.uv.sources]
ferry-core = { path = "../../crates/ferry-python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["dagster_ferry"]

[tool.hatch.build.targets.sdist]
include = [
    "dagster_ferry",
    "tests",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dagster_ferry"]

[tool.pyright]
include = ["dagster_ferry", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"
# Apply true strict checking to public code only. Tests stay at standard.
strict = ["dagster_ferry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
