[package]
name = "ferry-destinations"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `test-util` enables the `GoogleSheetsDestination::new_for_test`
# constructor, which bypasses production-only host/HTTPS/key-file checks so
# integration tests can point at a wiremock server. Production builds must
# never enable this feature — it is a deliberate security escape hatch.
# `ferry-tests` enables it as a dev-dependency.
test-util = []

[dependencies]
ferry-core = { path = "../ferry-core" }
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-cast.workspace = true
reqwest.workspace = true
url.workspace = true
minijinja.workspace = true
http.workspace = true
regex.workspace = true
futures.workspace = true
base64.workspace = true
once_cell.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
yup-oauth2.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
