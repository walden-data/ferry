[package]
name = "ferry-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ferry-core = { path = "../ferry-core" }
ferry-sources = { path = "../ferry-sources" }
# Enable `test-util` so integration tests can use
# `GoogleSheetsDestination::new_for_test` (the test-only constructor that
# bypasses production host/HTTPS/key-file checks). Production builds do not
# enable this feature.
ferry-destinations = { path = "../ferry-destinations", features = ["test-util"] }
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
tokio.workspace = true
duckdb.workspace = true
tempfile.workspace = true
serde_json.workspace = true
chrono.workspace = true
futures.workspace = true
tracing.workspace = true
async-trait.workspace = true
regex.workspace = true

[dev-dependencies]
wiremock.workspace = true
rsa.workspace = true
# `rand 0.8` (not the workspace `rand 0.9`) because `rsa 0.9` uses
# `rand_core 0.6`. Test-only.
rand_08 = { package = "rand", version = "0.8" }
