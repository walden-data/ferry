[workspace]
members = [
    "crates/ferry-core",
    "crates/ferry-sources",
    "crates/ferry-destinations",
    "crates/ferry-cli",
    "crates/ferry-python",
    "crates/ferry-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
arrow-cast = "58"
duckdb = { version = "~1.10504.0", features = ["bundled", "r2d2", "chrono"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
pyo3 = "0.28"
pyo3-arrow = "0.18"
governor = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
async-trait = "0.1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
r2d2 = "0.8"
once_cell = "1"
futures = "0.3"
tempfile = "3"
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
async-stream = "0.3"
